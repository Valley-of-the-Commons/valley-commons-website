<!doctype html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Cover · alt C (living cell)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="_tokens.css"/>
<style>
.stage{flex-direction:row;gap:70px;text-align:left;justify-content:center;}
.cell{width:440px;height:440px;flex-shrink:0;}
.pulse{transform-origin:center;animation:pulse 6s ease-in-out infinite;}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.05);opacity:.9}}
.col{max-width:24em;}
@media (max-width:900px){.stage{flex-direction:column;gap:30px;text-align:center;}.cell{width:300px;height:300px;}.col{max-width:32em;}}
</style></head><body>
<div class="cosmos"><div class="stars far"></div><div class="stars near"></div></div>
<div class="stage">
  <div class="cell"><svg width="440" height="440" viewBox="0 0 440 440" id="cell"></svg></div>
  <div class="col">
    <p class="eyebrow">Valley of the Commons <span class="dot">·</span> closing keynote</p>
    <h1 style="font-size:56px;margin-top:18px;">Game Theory of Our <span class="serif-em fg-em">Shared Purpose</span></h1>
    <p class="sub" style="margin-top:22px;">A community is a living cell. This talk is about its membrane, and the two games that grow one.</p>
  </div>
</div>
<div class="tag"><b>ALT C</b> &nbsp; cover · living cell</div>
<script>
const NS="http://www.w3.org/2000/svg",S=document.getElementById('cell');
function el(t,a){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;}
const cx=220,cy=220;
S.appendChild(el('circle',{cx,cy,r:150,fill:'rgba(52,211,153,.05)'}));
[[190,'var(--emerald)'],[150,'var(--ice)']].forEach(([r,col],i)=>{const c=el('circle',{cx,cy,r,fill:'none',stroke:col,'stroke-opacity':.5,'stroke-width':1.6,'stroke-dasharray':'2 9',class:'pulse'});c.style.animationDelay=(i*1.2)+'s';S.appendChild(c);});
// light escaping outward
for(let i=0;i<10;i++){const a=i*2*Math.PI/10;const d=el('circle',{cx:cx+205*Math.cos(a),cy:cy+205*Math.sin(a),r:3.5,fill:'var(--ice)'});d.style.filter='drop-shadow(0 0 6px var(--ice))';d.style.animation=`tw ${3+i*.3}s ease-in-out infinite`;S.appendChild(d);
  S.appendChild(el('line',{x1:cx+120*Math.cos(a),y1:cy+120*Math.sin(a),x2:cx+205*Math.cos(a),y2:cy+205*Math.sin(a),stroke:'var(--ice)','stroke-opacity':.3,'stroke-width':1}));}
const nuc=el('circle',{cx,cy,r:64,fill:'rgba(177,79,255,.10)',stroke:'var(--violet)','stroke-width':1.4});nuc.style.filter='drop-shadow(0 0 18px var(--violet))';S.appendChild(nuc);
S.appendChild(el('circle',{cx,cy,r:22,fill:'var(--violet)','fill-opacity':.5}));
const t=el('text',{x:cx,y:cy+5,'text-anchor':'middle','font-family':'var(--mono)','font-size':'12',fill:'#fff','letter-spacing':'.14em'});t.textContent='PURPOSE';S.appendChild(t);
</script></body></html>
